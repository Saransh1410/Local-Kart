        // Straight-line distance in metres (Haversine formula)
        function getDistanceMeters(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const toRad = (deg) => (deg * Math.PI) / 180;
            const dLat = toRad(lat2 - lat1);
            const dLon = toRad(lon2 - lon1);
            const a =
                Math.sin(dLat / 2) ** 2 +
                Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
            return Math.round(2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
        }

        // Format distance nicely (e.g. "240m" or "1.4 km")
        function formatDistance(meters) {
            if (meters >= 1000) {
                return `${(meters / 1000).toFixed(1)} km`;
            }
            return `${meters}m`;
        }

        // Free browser Geolocation helper
        function fetchLiveGPS() {
            return new Promise((resolve, reject) => {
                if (!navigator.geolocation) {
                    reject(new Error("GPS is not supported by this browser."));
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        resolve({
                            lat: Number(pos.coords.latitude.toFixed(6)),
                            lng: Number(pos.coords.longitude.toFixed(6)),
                            accuracy: Math.round(pos.coords.accuracy)
                        });
                    },
                    (err) => {
                        if (err.code === 1) {
                            reject(new Error("Location permission denied. Please allow location in browser settings."));
                        } else {
                            reject(new Error("Could not get GPS signal. You can enter Lat/Lng manually."));
                        }
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            });
        }

        function readLocalDB() {
            try {
                const saved = localStorage.getItem(LOCAL_DB_KEY);
                if (saved) return JSON.parse(saved);
            } catch (err) {
                console.warn("Could not read localStorage:", err);
            }
            localStorage.setItem(LOCAL_DB_KEY, JSON.stringify(INITIAL_DATA));
            return JSON.parse(JSON.stringify(INITIAL_DATA));
        }

        function writeLocalDB(db) {
            try {
                localStorage.setItem(LOCAL_DB_KEY, JSON.stringify(db));
            } catch (err) {
                console.warn("Could not save to localStorage:", err);
            }
        }

        function getAllAvailableProducts(storeList) {
            const seen = {};
            const result = [];
            for (const store of storeList) {
                if (!store.subscriptionActive || store.status !== "Active") continue;
                for (const prod of store.products) {
                    if (!seen[prod.name]) {
                        seen[prod.name] = true;
                        result.push(prod);
                    }
                }
            }
            return result;
        }

        function App() {
            const [serverMode, setServerMode] = useState("checking"); // 'checking' | 'fastapi' | 'local'
            const [notice, setNotice] = useState(null);

            // Auth states
            const [user, setUser] = useState(null);
            const [authTab, setAuthTab] = useState("login");
            const [role, setRole] = useState("customer");
            const [fullName, setFullName] = useState("");
            const [email, setEmail] = useState("");

            const [shopName, setShopName] = useState("");
            const [shopAddress, setShopAddress] = useState("");
            const [shopLat, setShopLat] = useState("22.7540");
            const [shopLng, setShopLng] = useState("75.8940");

            const [authError, setAuthError] = useState("");

            const [stores, setStores] = useState([]);

            const [instantDelivery, setInstantDelivery] = useState(false);
            const [showCheckout, setShowCheckout] = useState(false);
            const [paymentType, setPaymentType] = useState("cod");
            const [processingOrder, setProcessingOrder] = useState(false);

            // Store owner workflow states
            const [storeSection, setStoreSection] = useState("orders");
            const [prodName, setProdName] = useState("");
            const [prodPrice, setProdPrice] = useState("");
            const [prodUnit, setProdUnit] = useState("");
            const [prodDesc, setProdDesc] = useState("");
            const [prodStock, setProdStock] = useState("");

            // Admin workflow states
            const [adminSection, setAdminSection] = useState("overview");

            function showNotice(text, type = "info") {
                setNotice({ text, type });
                setTimeout(() => setNotice(null), 3200);
            }

            // Detect if local Python FastAPI server is running
            useEffect(() => {
                async function detectServer() {
                    try {
                        const controller = new AbortController();
                        const timer = setTimeout(() => controller.abort(), 1200);
                        const res = await fetch(`${API_URL}/health`, { signal: controller.signal });
                        clearTimeout(timer);
                        if (res.ok) {
                            setServerMode("fastapi");
                            return;
                        }
                    } catch (err) {
                        // Server not reachable, use standalone browser mode
                    }
                    setServerMode("local");
                }
                detectServer();
            }, []);

            // Fetch stores and orders from active data source
            const loadAppData = useCallback(async (userOverride = null, locOverride = null) => {
                const activeUser = userOverride || user;
                const activeLoc = locOverride || selectedLoc;

                if (serverMode === "fastapi") {
                    try {
                        const storeRes = await fetch(`${API_URL}/stores?lat=${activeLoc.lat}&lng=${activeLoc.lng}`);
                        const storeData = await storeRes.json();
                        setStores(storeData);

                        if (activeUser) {
                            let ordersUrl = `${API_URL}/orders?role=${activeUser.role}`;
                            if (activeUser.role === "customer") {
                                ordersUrl += `&email=${encodeURIComponent(activeUser.email)}`;
                            } else if (activeUser.role === "store") {
                                ordersUrl += `&store_id=${activeUser.store_id || 1}`;
                            }
                            const orderRes = await fetch(ordersUrl);
                            const orderData = await orderRes.json();
                            setOrders(orderData);
                        }
                    } catch (err) {
                        // Ignore temporary polling failures
                    }
                } else if (serverMode === "local") {
                    const db = readLocalDB();
                    const updatedStores = db.stores.map((s) => ({
                        ...s,
                        distance: getDistanceMeters(activeLoc.lat, activeLoc.lng, s.lat, s.lng)
                    }));
                    updatedStores.sort((a, b) => (b.premium - a.premium) || (a.distance - b.distance));
                    setStores(updatedStores);

                    if (activeUser) {
                        let visibleOrders = db.orders;
                        if (activeUser.role === "customer") {
                            visibleOrders = db.orders.filter((o) => o.customerEmail === activeUser.email);
                        } else if (activeUser.role === "store") {
                            visibleOrders = db.orders.filter((o) => o.storeId === (activeUser.store_id || 1));
                        }
                        setOrders(visibleOrders);
                    }
                }
            }, [serverMode, user, selectedLoc]);

            // Initial load when user/location changes
            useEffect(() => {
                if (serverMode !== "checking") {
                    loadAppData();
                }
            }, [serverMode, user, selectedLoc, loadAppData]);

            // Real-time auto-sync every 3 seconds when connected to FastAPI
            useEffect(() => {
                if (serverMode !== "fastapi" || !user) return;
                const interval = setInterval(() => {
                    loadAppData();
                }, 3000);
                return () => clearInterval(interval);
            }, [serverMode, user, loadAppData]);

            // --- GPS Handlers ---
            async function handleCaptureStoreGPS() {
                setCapturingGps(true);
                try {
                    const coords = await fetchLiveGPS();
                    setShopLat(String(coords.lat));
                    setShopLng(String(coords.lng));
                    if (!shopAddress.trim()) {
                        setShopAddress(`Live GPS (${coords.lat}, ${coords.lng})`);
                    }
                    showNotice(`Store GPS captured (±${coords.accuracy}m)`, "success");
                } catch (err) {
                    showNotice(err.message, "error");
                } finally {
                    setCapturingGps(false);
                }
            }

            async function handleDetectCustomerGPS() {
                setCapturingGps(true);
                try {
                    const coords = await fetchLiveGPS();
                    const liveLoc = {
                        label: `My Live GPS (${coords.lat}, ${coords.lng})`,
                        lat: coords.lat,
                        lng: coords.lng
                    };
                    setSelectedLoc(liveLoc);
                    setCustomLat(String(coords.lat));
                    setCustomLng(String(coords.lng));
                    setLocationConfirmed(true);
                    loadAppData(null, liveLoc);
                    showNotice(`Live GPS locked (±${coords.accuracy}m)`, "success");
                } catch (err) {
                    showNotice(err.message, "error");
                } finally {
                    setCapturingGps(false);
                }
            }

            function handleApplyManualCoordinates() {
                const lat = parseFloat(customLat);
                const lng = parseFloat(customLng);
                if (isNaN(lat) || isNaN(lng)) {
                    showNotice("Enter valid numeric Latitude and Longitude.", "error");
                    return;
                }
                const manualLoc = { label: `Custom (${lat.toFixed(4)}, ${lng.toFixed(4)})`, lat, lng };
                setSelectedLoc(manualLoc);
                setLocationConfirmed(true);
                loadAppData(null, manualLoc);
                showNotice("Custom coordinates applied.", "success");
            }

            async function handleMoveExistingStoreToGPS(storeId) {
                setCapturingGps(true);
                try {
                    const coords = await fetchLiveGPS();
                    await updateStoreFlags(storeId, {
                        lat: coords.lat,
                        lng: coords.lng,
                        address: `Live GPS (${coords.lat}, ${coords.lng})`
                    });
                    showNotice("Store moved to your live GPS location!", "success");
                } catch (err) {
                    showNotice(err.message, "error");
                } finally {
                    setCapturingGps(false);
                }
            }

            // --- Login & Registration ---
            async function handleAuth(e) {
                e.preventDefault();
                setAuthError("");

                if (!email.trim() || !password.trim()) {
                    setAuthError("Please fill in both email and password.");
                    return;
                }

                setIsSubmitting(true);
                try {
                    if (serverMode === "fastapi") {
                        const path = authTab === "login" ? "/auth/login" : "/auth/register";
                        const res = await fetch(`${API_URL}${path}`, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                name: fullName || email.split("@")[0],
                                email: email.trim(),
                                password,
                                role,
                                store_name: shopName || undefined,
                                store_address: shopAddress || "Local Area",
                                store_lat: parseFloat(shopLat) || 22.7540,
                                store_lng: parseFloat(shopLng) || 75.8940
                            })
                        });
                        const data = await res.json();
                        if (!res.ok) throw new Error(data.detail || "Login failed.");
                        setUser(data.user);
                        setPassword("");
                        showNotice(`Logged in as ${data.user.name}`, "success");
                        loadAppData(data.user);
                    } else {
                        const db = readLocalDB();
                        const cleanEmail = email.trim().toLowerCase();

                        if (authTab === "login") {
                            const match = db.users.find(
                                (u) => u.email === cleanEmail && u.password === password && u.role === role
                            );
                            if (!match) {
                                throw new Error(
                                    role === "admin"
                                        ? "Invalid Admin credentials. Access denied."
                                        : "Incorrect email or password for this role."
                                );
                            }
                            setUser(match);
                            setPassword("");
                            showNotice(`Welcome back, ${match.name}`, "success");
                            loadAppData(match);
                        } else {
                            if (role === "admin") throw new Error("Admin signup is disabled.");
                            if (db.users.some((u) => u.email === cleanEmail)) {
                                throw new Error("This email is already registered.");
                            }

                            let newStoreId = null;
                            if (role === "store") {
                                newStoreId = db.stores.length + 1;
                                db.stores.push({
                                    id: newStoreId,
                                    name: shopName.trim() || `${fullName || "Local"} Store`,
                                    address: shopAddress.trim() || "Local Area",
                                    lat: parseFloat(shopLat) || 22.7535,
                                    lng: parseFloat(shopLng) || 75.8940,
                                    distance: 0,
                                    premium: false,
                                    subscriptionActive: true,
                                    status: "Active",
                                    products: [{ id: Date.now(), name: "Sample Rice", price: 75, unit: "1 kg", description: "Everyday basmati rice", stock: 10 }]
                                });
                            }

                            const createdUser = {
                                id: db.users.length + 1,
                                name: fullName.trim() || cleanEmail.split("@")[0],
                                email: cleanEmail,
                                password,
                                role,
                                store_id: newStoreId
                            };
                            db.users.push(createdUser);
                            writeLocalDB(db);
                            setUser(createdUser);
                            setPassword("");
                            showNotice("Account created successfully.", "success");
                            loadAppData(createdUser);
                        }
                    }
                } catch (err) {
                    setAuthError(err.message);
                } finally {
                    setIsSubmitting(false);
                }
            }

            function handleLogout() {
                setUser(null);
                setSearchText("");
                setCart([]);
                setActiveStoreId(null);
                setInstantDelivery(false);
                setPage("home");
                setEmail("");
                setPassword("");
                setAuthError("");
            }

            // --- Store & Order Management Actions ---
            async function addNewProduct(e) {
                e.preventDefault();
                const storeId = user.store_id || 1;
                const price = parseFloat(prodPrice);
                const stock = parseInt(prodStock, 10);
                const unit = prodUnit.trim() || "1 unit";
                const description = prodDesc.trim();

                if (!prodName.trim() || isNaN(price) || price <= 0 || isNaN(stock) || stock < 0) {
                    showNotice("Please enter a valid name, price, and stock.", "error");
                    return;
                }

                if (serverMode === "fastapi") {
                    const res = await fetch(`${API_URL}/stores/${storeId}/products`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ name: prodName.trim(), price, unit, description, stock })
                    });
                    if (!res.ok) {
                        showNotice("Could not add product.", "error");
                        return;
                    }
                } else {
                    const db = readLocalDB();
                    const myStore = db.stores.find((s) => s.id === storeId);
                    if (myStore) {
                        myStore.products.push({ id: Date.now(), name: prodName.trim(), price, unit, description, stock });
                        writeLocalDB(db);
                    }
                }

                setProdName("");
                setProdPrice("");
                setProdUnit("");
                setProdDesc("");
                setProdStock("");
                showNotice("Product added to catalogue.", "success");
                loadAppData();
            }

            async function updateStock(storeId, productId, nextStock) {
                const validStock = Math.max(0, nextStock);
                if (serverMode === "fastapi") {
                    await fetch(`${API_URL}/products/${productId}`, {
                        method: "PATCH",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ stock: validStock })
                    });
                } else {
                    const db = readLocalDB();
                    const st = db.stores.find((s) => s.id === storeId);
                    if (st) {
                        const item = st.products.find((p) => p.id === productId);
                        if (item) item.stock = validStock;
                        writeLocalDB(db);
                    }
                }
                loadAppData();
            }

            async function updateStoreFlags(storeId, changes) {
                if (serverMode === "fastapi") {
                    await fetch(`${API_URL}/stores/${storeId}`, {
                        method: "PATCH",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            premium: changes.premium,
                            subscription_active: changes.subscriptionActive,
                            status: changes.status,
                            address: changes.address,
                            lat: changes.lat,
                            lng: changes.lng
                        })
                    });
                } else {
                    const db = readLocalDB();
                    const st = db.stores.find((s) => s.id === storeId);
                    if (st) {
                        if (changes.premium !== undefined) st.premium = changes.premium;
                        if (changes.subscriptionActive !== undefined) st.subscriptionActive = changes.subscriptionActive;
                        if (changes.status !== undefined) st.status = changes.status;
                        if (changes.address !== undefined) st.address = changes.address;
                        if (changes.lat !== undefined) st.lat = changes.lat;
                        if (changes.lng !== undefined) st.lng = changes.lng;
                        writeLocalDB(db);
                    }
                }
                loadAppData();
            }

            async function updateOrder(orderId, changes) {
                if (serverMode === "fastapi") {
                    await fetch(`${API_URL}/orders/${orderId}`, {
                        method: "PATCH",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            status: changes.status,
                            batch: changes.batch,
                            payment_status: changes.paymentStatus
                        })
                    });
                } else {
                    const db = readLocalDB();
                    const order = db.orders.find((o) => o.id === orderId);
                    if (order) {
                        if (changes.status !== undefined) order.status = changes.status;
                        if (changes.batch !== undefined) order.batch = changes.batch;
                        if (changes.paymentStatus !== undefined) order.paymentStatus = changes.paymentStatus;
                        writeLocalDB(db);
                    }
                }
                showNotice(`Order ${orderId} updated.`, "success");
                loadAppData();
            }

            // --- Customer Cart & Checkout ---
            function handleAddToCart(product, store) {
                if (product.stock <= 0) {
                    showNotice("This item is out of stock.", "error");
                    return;
                }

                if (cart.length > 0 && cart[0].storeId !== store.id) {
                    setCart([{ ...product, qty: 1, storeId: store.id, storeName: store.name, storeDistance: store.distance }]);
                    setInstantDelivery(false);
                    showNotice(`Cart switched to ${store.name}`, "info");
                    return;
                }

                const existing = cart.find((item) => item.id === product.id);
                if (existing) {
                    if (existing.qty >= product.stock) {
                        showNotice(`Only ${product.stock} available in stock.`, "error");
                        return;
                    }
                    setCart(cart.map((item) => (item.id === product.id ? { ...item, qty: item.qty + 1 } : item)));
                } else {
                    setCart([...cart, { ...product, qty: 1, storeId: store.id, storeName: store.name, storeDistance: store.distance }]);
                }
                showNotice(`Added ${product.name}`, "success");
            }

            function handleUpdateCartQty(productId, delta) {
                const target = cart.find((item) => item.id === productId);
                if (!target) return;

                const nextQty = target.qty + delta;
                if (nextQty <= 0) {
                    handleRemoveFromCart(productId);
                    return;
                }

                if (delta > 0) {
                    const storeObj = stores.find((s) => s.id === target.storeId);
                    const liveProd = storeObj && storeObj.products.find((p) => p.id === productId);
                    const maxStock = liveProd ? liveProd.stock : target.stock;
                    if (maxStock !== undefined && nextQty > maxStock) {
                        showNotice(`Only ${maxStock} available in stock.`, "error");
                        return;
                    }
                }

                setCart(cart.map((item) => (item.id === productId ? { ...item, qty: nextQty } : item)));
            }

            function handleRemoveFromCart(productId) {
                const updatedCart = cart.filter((item) => item.id !== productId);
                setCart(updatedCart);
                if (updatedCart.length === 0) {
                    setInstantDelivery(false);
                }
                showNotice("Item removed from cart.", "info");
            }

            function handleClearCart() {
                setCart([]);
                setInstantDelivery(false);
                showNotice("Cart cleared.", "info");
            }

            function handleInstantBuy(productName) {
                const matchingStores = stores.filter(
                    (s) => s.subscriptionActive && s.status === "Active" && s.products.some((p) => p.name === productName && p.stock > 0)
                );

                if (matchingStores.length === 0) {
                    showNotice("Currently out of stock in all active stores.", "error");
                    return;
                }

                matchingStores.sort((a, b) => a.distance - b.distance);
                const nearestStore = matchingStores[0];
                const product = nearestStore.products.find((p) => p.name === productName);

                setCart([{ ...product, qty: 1, storeId: nearestStore.id, storeName: nearestStore.name, storeDistance: nearestStore.distance }]);
                setInstantDelivery(true);
                setPage("cart");
                setSearchText("");
                showNotice(`Assigned to ${nearestStore.name} (${formatDistance(nearestStore.distance)})`, "success");
            }

            const subtotal = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
            const distanceFee = cart.length > 0 && cart[0].storeDistance > 500 ? 40 : 0;
            const instantFee = instantDelivery ? 50 : 0;
            const totalPayable = subtotal + distanceFee + instantFee;

            async function confirmOrder() {
                if (cart.length === 0) return;
                setProcessingOrder(true);

                try {
                    if (serverMode === "fastapi") {
                        const res = await fetch(`${API_URL}/orders`, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                customer_email: user.email,
                                store_id: cart[0].storeId,
                                delivery_location: selectedLoc.label,
                                customer_lat: selectedLoc.lat,
                                customer_lng: selectedLoc.lng,
                                items: cart.map((i) => ({ product_id: i.id, name: i.name, price: i.price, qty: i.qty })),
                                is_instant: instantDelivery,
                                payment_method: paymentType
                            })
                        });
                        const created = await res.json();
                        if (!res.ok) throw new Error(created.detail || "Could not place order.");

                        if (paymentType === "razorpay") {
                            await new Promise((resolve) => setTimeout(resolve, 650));
                            await fetch(`${API_URL}/payments/razorpay/mock-verify`, {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({
                                    order_id: created.order_id,
                                    mock_payment_id: created.payment_ref
                                })
                            });
                        }
                    } else {
                        if (paymentType === "razorpay") {
                            await new Promise((resolve) => setTimeout(resolve, 600));
                        }
                        const db = readLocalDB();
                        const st = db.stores.find((s) => s.id === cart[0].storeId);
                        if (!st || !st.subscriptionActive || st.status !== "Active") {
                            throw new Error("Store is currently unavailable.");
                        }

                        for (const item of cart) {
                            const dbProd = st.products.find((p) => p.id === item.id);
                            if (!dbProd || dbProd.stock < item.qty) {
                                throw new Error(`Not enough stock for ${item.name}.`);
                            }
                        }

                        for (const item of cart) {
                            const dbProd = st.products.find((p) => p.id === item.id);
                            dbProd.stock -= item.qty;
                        }

                        const newOrderId = "ORD-" + Math.random().toString(36).substring(2, 8).toUpperCase();
                        db.orders.unshift({
                            id: newOrderId,
                            customerEmail: user.email,
                            storeId: st.id,
                            storeName: st.name,
                            deliveryLocation: selectedLoc.label,
                            items: cart.map((i) => ({ id: i.id, name: i.name, price: i.price, qty: i.qty })),
                            subtotal,
                            distanceFee,
                            instantFee,
                            deliveryFee: distanceFee + instantFee,
                            total: totalPayable,
                            isInstant: instantDelivery,
                            status: "Pending Acceptance",
                            paymentMethod: paymentType,
                            paymentStatus: paymentType === "razorpay" ? "Verified (Mock Razorpay)" : "Pending (COD)",
                            paymentRef: paymentType === "razorpay" ? `RZP_MOCK_${newOrderId}` : `COD_${newOrderId}`,
                            batch: instantDelivery ? "Instant Dispatch" : "Unassigned",
                            timestamp: new Date().toLocaleString()
                        });
                        writeLocalDB(db);
                    }

                    setCart([]);
                    setInstantDelivery(false);
                    setShowCheckout(false);
                    setPage("orders");
                    showNotice("Order placed successfully.", "success");
                    loadAppData();
                } catch (err) {
                    showNotice(err.message, "error");
                } finally {
                    setProcessingOrder(false);
                }
            }

                                                <h2 className="font-extrabold text-lg text-slate-800 mb-2">My Orders</h2>
                                                {orders.length === 0 ? (
                                                    <p className="text-xs text-slate-400 bg-white p-6 rounded-2xl border text-center">
                                                        No orders placed yet.
                                                    </p>
                                                ) : (
                                                    orders.map((order) => (
                                                        <div key={order.id} className="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
                                                            <div className="flex justify-between items-center border-b pb-2 mb-2">
                                                                <span className="font-extrabold text-xs text-slate-800">{order.id}</span>
                                                                <span className="text-[10px] font-bold bg-blue-100 text-blue-800 px-2 py-0.5 rounded-full">
                                                                    {order.status}
                                                                </span>
                                                            </div>
                                                            <p className="text-sm font-bold text-slate-800">{order.storeName}</p>
                                                            <p className="text-[11px] text-slate-500 mt-0.5">
                                                                Batch: <b className="text-slate-700">{order.batch}</b> • {order.timestamp}
                                                            </p>
                                                            <div className="mt-2 pt-2 border-t flex justify-between items-center text-xs">
                                                                <span className="font-extrabold text-emerald-700">₹{order.total}</span>
                                                                <span className="text-[10px] bg-slate-100 text-slate-700 px-2 py-0.5 rounded font-semibold">
                                                                    {order.paymentMethod.toUpperCase()} • {order.paymentStatus}
                                                                </span>
                                                            </div>
                                                        </div>
                                                    ))
                                                )}
                                            </div>
                                        )}
                                    </div>

                                    {/* Bottom Tab Bar */}
                                    <div className="bg-white border-t border-slate-200 flex justify-around py-2 px-3 fixed bottom-0 w-full max-w-md z-20">
                                        {["home", "cart", "orders"].map((tab) => (
                                            <button
                                                key={tab}
                                                onClick={() => setPage(tab)}
                                                className={`flex flex-col items-center text-[11px] font-bold px-4 py-1.5 rounded-xl relative ${
                                                    page === tab || (tab === "home" && page === "store")
                                                        ? "text-blue-600 bg-blue-50"
                                                        : "text-slate-500"
                                                }`}
                                            >
                                                <span className="capitalize">{tab}</span>
                                                {tab === "cart" && cart.length > 0 && (
                                                    <span className="absolute -top-1 right-1 bg-red-500 text-white text-[9px] font-bold rounded-full h-4 w-4 flex items-center justify-center">
                                                        {cart.length}
                                                    </span>
                                                )}
                                            </button>
                                        ))}
                                    </div>

                                    {/* Payment Selection Modal */}
                                    {showCheckout && (
                                        <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-50">
                                            <div className="bg-white p-5 rounded-2xl w-full max-w-sm shadow-2xl">
                                                <h3 className="font-extrabold text-lg text-slate-800 mb-3 border-b pb-2">
                                                    Select Payment Method
                                                </h3>
                                                <div className="space-y-2.5 mb-4">
                                                    <label className={`flex items-center p-3 border rounded-xl cursor-pointer text-sm font-semibold ${
                                                        paymentType === "cod" ? "border-blue-500 bg-blue-50" : "bg-slate-50"
                                                    }`}>
                                                        <input
                                                            type="radio"
                                                            name="pay"
                                                            checked={paymentType === "cod"}
                                                            onChange={() => setPaymentType("cod")}
                                                            className="mr-3"
                                                        />
                                                        Cash on Delivery (COD)
                                                    </label>
                                                    <label className={`flex items-center p-3 border rounded-xl cursor-pointer text-sm font-semibold ${
                                                        paymentType === "razorpay" ? "border-blue-500 bg-blue-50" : "bg-slate-50"
                                                    }`}>
                                                        <input
                                                            type="radio"
                                                            name="pay"
                                                            checked={paymentType === "razorpay"}
                                                            onChange={() => setPaymentType("razorpay")}
                                                            className="mr-3"
                                                        />
                                                        Razorpay Online (Mock UPI / Card)
                                                    </label>
                                                </div>
                                                {paymentType === "razorpay" && (
                                                    <div className="bg-indigo-50 border border-indigo-200 p-3 rounded-xl text-[11px] text-indigo-800 mb-4">
                                                        <b>Demo Mode:</b> Simulates Razorpay checkout and backend signature verification without real payment charges.
                                                    </div>
                                                )}
                                                <div className="flex gap-2.5">
                                                    <button
                                                        disabled={processingOrder}
                                                        onClick={() => setShowCheckout(false)}
                                                        className="flex-1 bg-slate-100 text-slate-700 py-2.5 rounded-xl font-bold text-xs"
                                                    >
                                                        Cancel
                                                    </button>
                                                    <button
                                                        disabled={processingOrder}
                                                        onClick={confirmOrder}
                                                        className="flex-1 bg-blue-600 text-white py-2.5 rounded-xl font-bold text-xs shadow-md"
                                                    >
                                                        {processingOrder ? "Processing..." : `Confirm ₹${totalPayable}`}
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </>
                            )}
                        </>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
